name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: ltv-admin-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: ltv-admin-aarch64-unknown-linux-gnu
            cross: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation dependencies (aarch64)
        if: matrix.cross == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cargo build --release --target ${{ matrix.target }} --locked
          else
            cargo build --release --locked
          fi

      - name: Create release tarball
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"  # strip leading 'v'
          TARBALL="${{ matrix.artifact }}-${VERSION}.tar.gz"

          mkdir -p staging
          if [ "${{ matrix.cross }}" = "true" ]; then
            cp target/${{ matrix.target }}/release/ltv-admin staging/
          else
            cp target/release/ltv-admin staging/
          fi
          # Include license, readme, and docs
          cp LICENSE staging/ 2>/dev/null || echo "No LICENSE file found"
          cp README.md staging/ 2>/dev/null || echo "No README.md found"
          cp -r docs staging/ 2>/dev/null || echo "No docs directory found"

          tar -czf "${TARBALL}" -C staging .
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"

          mkdir -p artifacts
          mv "${TARBALL}" "${TARBALL}.sha256" artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: LTV ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/ltv-admin-x86_64-unknown-linux-gnu-*.tar.gz
            artifacts/ltv-admin-x86_64-unknown-linux-gnu-*.tar.gz.sha256
            artifacts/ltv-admin-aarch64-unknown-linux-gnu-*.tar.gz
            artifacts/ltv-admin-aarch64-unknown-linux-gnu-*.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --locked